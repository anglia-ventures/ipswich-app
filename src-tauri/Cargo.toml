[package]
name = "ipswich-app"
version = "0.1.0"
description = "Ipswich News cross-platform app"
authors = ["Ipswich News"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ipswich_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Used to bundle a release build with stripped symbols and LTO.
custom-protocol = ["tauri/custom-protocol"]
